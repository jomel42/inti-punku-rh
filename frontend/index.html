<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inti Punku - RRHH</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>Inti Punku</h1>
        <p>Sistema de Recursos Humanos</p>
    </header>

    <main>

        <section class="resumen">

            <div class="card">
                <h2 id="total-empleados">0</h2>
                <p>Empleados</p>
            </div>

            <div class="card">
                <h2 id="total-departamentos">0</h2>
                <p>Departamentos</p>
            </div>

            <div class="card">
                <h2 id="total-cargos">0</h2>
                <p>Cargos</p>
            </div>

        </section>

        <section>

            <h2>Empleados registrados</h2>

            <table>

                <thead>
                    <tr>
                        <th>Nombre</th>
                        <th>Correo</th>
                        <th>Departamento</th>
                        <th>Cargo</th>
                        <th>Salario</th>
                    </tr>
                </thead>

                <tbody id="tabla-empleados">
                </tbody>

            </table>

        </section>

    </main>

    <script src="app.js"></script>

</body>
</html>
