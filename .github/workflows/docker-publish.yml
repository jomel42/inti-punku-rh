name: Construir y publicar imagenes Docker

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  docker:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Iniciar sesion en Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Construir y publicar Backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: jomel42/inti-punku-backend:1.0

      - name: Construir y publicar Frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: jomel42/inti-punku-frontend:1.0

      - name: Construir y publicar Proxy
        uses: docker/build-push-action@v6
        with:
          context: ./proxy
          push: true
          tags: jomel42/inti-punku-proxy:1.0